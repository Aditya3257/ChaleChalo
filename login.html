<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | ChaloChale</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-showcase login-showcase">
        <a class="auth-brand text-white text-decoration-none" href="index.html">
          <i class="fa-solid fa-plane-departure text-warning me-2"></i>ChaloChale
        </a>
        <div class="auth-showcase-content">
          <span class="badge text-bg-warning mb-3">WELCOME BACK</span>
          <h1>Your next adventure is waiting</h1>
          <p>Sign in to manage bookings, explore destinations, and plan unforgettable trips.</p>
        </div>
      </section>

      <section class="auth-form-panel">
        <div class="auth-form-wrap">
          <a class="auth-mobile-brand" href="index.html">
            <i class="fa-solid fa-plane-departure text-warning me-2"></i>ChaloChale
          </a>
          <h2 class="fw-bold mb-2">Welcome back</h2>
          <p class="text-muted mb-4">Enter your details to access your account.</p>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="loginEmail">Email address</label>
              <input id="loginEmail" class="form-control auth-input" type="email" placeholder="you@example.com" required />
            </div>
            <div class="mb-2">
              <label class="form-label fw-semibold" for="loginPassword">Password</label>
              <div class="input-group">
                <input id="loginPassword" class="form-control auth-input" type="password" minlength="6" placeholder="Enter your password" required />
                <button class="btn btn-outline-secondary password-toggle" type="button" aria-label="Show password">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input id="rememberLogin" class="form-check-input" type="checkbox" />
                <label class="form-check-label" for="rememberLogin">Remember me</label>
              </div>
              <a class="text-decoration-none small" href="#">Forgot password?</a>
            </div>
            <button class="btn btn-primary auth-submit w-100 fw-bold" type="submit">Sign In</button>
            <div id="loginMessage" class="alert mt-3 mb-0 d-none" role="status"></div>
          </form>

          <p class="text-center text-muted mt-4 mb-0">
            New to ChaloChale? <a class="fw-semibold text-decoration-none" href="signup.html">Create an account</a>
          </p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/5c532d7eb2.js" crossorigin="anonymous"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
